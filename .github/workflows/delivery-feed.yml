name: Refresh delivery product feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: delivery-product-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live products and generate feed
        run: python scripts/build_delivery_feed.py
      - name: Commit only the generated product feed
        run: |
          git add feeds/delivery-products.xml feeds/delivery-products-audit.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh verified delivery product feed'
            git push origin HEAD:main
          fi
      - name: Publish current assets and product feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/theoystercart/oystercart-storefront/pages/builds
